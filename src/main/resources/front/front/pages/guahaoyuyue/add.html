    html::after {

                var swiperItemHtml = '';
                for (let item of res.data.list) {
                    if (item.name.indexOf('picture') >= 0 && item.value && item.value != "" && item.value != null) {
                        swiperItemHtml +=
                            '<div>' +
                            '<img style="width: 100%;height: 100%;object-fit:cover;" class="swiper-item" src="' + http.baseurl + item.value + '">' +
                            '</div>';
                    }
                }
                jquery('#swiper-item').html(swiperItemHtml);
                // 轮播图
                vue.$nextTick(() => {
                    carousel.render({
                        elem: '#swiper',
                        width: '100%',
                        height: '250px',
                        arrow: 'hover',
                        anim: 'default',
                        autoplay: 'true',
                        interval: '3000',
                        indicator: 'none'
                    });

                })
            }
        });

        form.on('select(piaoe)', function (data) {
            vue.detail.piaoe = data.value;
            if (data.value == "专家号") {
                vue.detail.guahaofei = 60
            } else if (data.value == "普通票") {
                vue.detail.guahaofei = 40
            }

        });

        form.on('select(riqi)', function (data) {
            vue.detail.riqi = data.value;

        });
        form.on('select(shangbanshijian)', function (data) {
            vue.detail.shangbanshijian = data.value;
            var param = {
                page: 1,
                limit: 2
            }
            var table = localStorage.getItem('crossTable');
            param.shangbanshijian = vue.detail.shangbanshijian
            param.riqi = vue.detail.riqi
            param.piaoe = vue.detail.piaoe





        });




        jquery('#jiuzhenshijian').val(getCurDateTime());
        laydate.render({
            elem: '#jiuzhenshijian',
            // type: 'datetime'
        });
        var edit = tinymce.render({
            elem: "#guahaobeizhu",
            height: 600,
            images_upload_handler: function (blobInfo, succFun, failFun) {
                var xhr, formData;
                var file = blobInfo.blob(); //转化为易于理解的file对象
                xhr = new XMLHttpRequest();
                xhr.withCredentials = false;
                xhr.open('POST', http.baseurl + 'file/upload');
                xhr.setRequestHeader("Token", localStorage.getItem('Token')); //设置请求头
                xhr.onload = function () {
                    var json;
                    if (xhr.status != 200) {
                        failFun('HTTP Error: ' + xhr.status);
                        return;
                    }
                    json = JSON.parse(xhr.responseText);
                    if (!json || typeof json.file != 'string') {
                        failFun('Invalid JSON: ' + xhr.responseText);
                        return;
                    }
                    succFun(http.baseurl + 'upload/' + json.file);
                };
                formData = new FormData();
                formData.append('file', file, file.name); //此处与源文档不一样
                xhr.send(formData);
            }
        }, (opt) => {

        });

        // session独取
        let table = localStorage.getItem("userTable");
        http.request(`${table}/session`, 'get', {}, function (data) {
            // 表单赋值
            //form.val("myForm", data.data);
            data = data.data
            for (
            		var key in data) {
                if (key == 'zhanghao') {
                    vue.detail[`zhanghao`] = data[`${key}`]
                    vue.ro.zhanghao = true;
                    continue;
                }
                if (key == 'xingming') {
                    vue.detail[`xingming`] = data[`${key}`]
                    vue.ro.xingming = true;
                    continue;
                }
                if (key == 'shouji') {
                    vue.detail[`shouji`] = data[`${key}`]
                    vue.ro.shouji = true;
                    continue;
                }
                if (key == 'shenfenzheng') {
                    vue.detail[`shenfenzheng`] = data[`${key}`]
                    vue.ro.shenfenzheng = true;
                    continue;
                }
            }
        });

        // 跨表
        if (http.getParam('corss')) {
            var obj = JSON.parse(localStorage.getItem('crossObj'));
            for (var o in obj) {
                if (o == 'yuyuebianhao') {
                    vue.detail[o] = obj[o];
                    vue.ro.yuyuebianhao = true;
                    continue;
                }
                if (o == 'keshihao') {
                    vue.detail[o] = obj[o];
                    vue.ro.keshihao = true;
                    continue;
                }
                if (o == 'keshimingcheng') {
                    vue.detail[o] = obj[o];
                    vue.ro.keshimingcheng = true;
                    continue;
                }
                if (o == 'piaoe') {
                    vue.detail[o] = obj[o];
                    vue.ro.piaoe = true;
                    continue;
                }
                if (o == 'riqi') {
                    vue.detail[o] = obj[o];
                    vue.ro.riqi = true;
                    continue;
                }
                if (o == 'guahaofei') {
                    vue.detail[o] = obj[o];
                    vue.ro.guahaofei = true;
                    continue;
                }
                if (o == 'jiuzhenshijian') {
                    vue.detail[o] = obj[o];
                    vue.ro.jiuzhenshijian = true;
                    jquery('#jiuzhenshijian').val(obj[o]);
                    continue;
                }
                if (o == 'guahaobeizhu') {
                    vue.detail[o] = obj[o];
                    vue.ro.guahaobeizhu = true;
                    continue;
                }
                if (o == 'yishengzhanghao') {
                    vue.detail[o] = obj[o];
                    vue.ro.yishengzhanghao = true;
                    continue;
                }
                if (o == 'yishengxingming') {
                    vue.detail[o] = obj[o];
                    vue.ro.yishengxingming = true;
                    continue;
                }
                if (o == 'lianxidianhua') {
                    vue.detail[o] = obj[o];
                    vue.ro.lianxidianhua = true;
                    continue;
                }
                if (o == 'zhanghao') {
                    vue.detail[o] = obj[o];
                    vue.ro.zhanghao = true;
                    continue;
                }
                if (o == 'xingming') {
                    vue.detail[o] = obj[o];
                    vue.ro.xingming = true;
                    continue;
                }
                if (o == 'shouji') {
                    vue.detail[o] = obj[o];
                    vue.ro.shouji = true;
                    continue;
                }
                if (o == 'shenfenzheng') {
                    vue.detail[o] = obj[o];
                    vue.ro.shenfenzheng = true;
                    continue;
                }
            }
        }

        vue.detail.piaoe = 0
        vue.ro.piaoe = false;

        // 提交
        form.on('submit(*)', function (data) {
            data = data.field;
            // 数据校验
            if (!data.piaoe) {
                layer.msg('挂号类型不能为空', {
                    time: 2000,
                    icon: 5
                });
                return false
            }
            if (!isIntNumer(data.guahaofei)) {
                layer.msg('挂号费应输入整数', {
                    time: 2000,
                    icon: 5
                });
                return false
            }
            var guahaobeizhu = tinymce.get('#guahaobeizhu').getContent()
            data.guahaobeizhu = guahaobeizhu;

            // 跨表计算判断
            // var obj = JSON.parse(localStorage.getItem('crossObj'));
            // obj.piaoe = obj.piaoe - data.piaoe

            //更新跨表属性
            var crossuserid;
            var crossrefid;
            var crossoptnum;
            if (http.getParam('corss')) {
                var statusColumnName = localStorage.getItem('statusColumnName');
                var statusColumnValue = localStorage.getItem('statusColumnValue');
                if (statusColumnName != '') {
                    var obj = JSON.parse(localStorage.getItem('crossObj'));
                    if (!statusColumnName.startsWith("[")) {
                        for (var o in obj) {
                            if (o == statusColumnName) {
                                obj[o] = statusColumnValue;
                            }
                        }
                        var table = localStorage.getItem('crossTable');
                        http.requestJson(`${table}/update`, 'post', obj, (res) => {
                        });
                    } else {
                        crossuserid = Number(localStorage.getItem('userid'));
                        crossrefid = obj['id'];
                        crossoptnum = localStorage.getItem('statusColumnName');
                        crossoptnum = crossoptnum.replace(/\[/, "").replace(/\]/, "");
                    }
                }
            }
            if (crossrefid && crossuserid) {
                data.crossuserid = crossuserid;
                data.crossrefid = crossrefid;
                http.request('guahaoyuyue/list', 'get', {
                    page: 1,
                    limit: 10,
                    crossuserid: crossuserid,
                    crossrefid: crossrefid,
                }, function (res) {
                    if (res.data.total >= crossoptnum) {
                        layer.msg(localStorage.getItem('tips'), {
                            time: 2000,
                            icon: 6
                        })
                        return false;
                    } else {
                        // 跨表计算
                        var obj = JSON.parse(localStorage.getItem('crossObj'));
                        var table = localStorage.getItem('crossTable');

                        obj.piaoe = parseFloat(obj.piaoe) - parseFloat(data.piaoe)

                        http.requestJson(`${table}/update`, 'post', obj, (res) => {
                        });
                        // 提交数据
                        http.requestJson('guahaoyuyue' + '/add', 'post', data, function (res) {
                            layer.msg('提交成功', {
                                time: 2000,
                                icon: 6
                            }, function () {
                                back();
                            });
                        });
                    }
                });
            } else {
                // 跨表计算
                var obj = JSON.parse(localStorage.getItem('crossObj'));
                var table = localStorage.getItem('crossTable');
                obj.piaoe = obj.piaoe - data.piaoe
                http.requestJson(`${table}/update`, 'post', obj, (res) => {
                });
                // 提交数据
                http.requestJson('guahaoyuyue' + '/add', 'post', data, function (res) {
                    layer.msg('提交成功', {
                        time: 2000,
                        icon: 6
                    }, function () {
                        back();
                    });
                });
            }

            return false
        });

    });
</script>
